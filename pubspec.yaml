name: turf_booking_workspace
description: Workspace for the Turf Booking customer, vendor, and admin apps.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - customer_app
  - vendor_app
  - admin_app
  - packages/app_core
  - packages/api_client
  - packages/auth_client
  - packages/design_system
  - packages/localization
  - packages/test_support

dev_dependencies:
  flutter_lints: ^6.0.0
